project:
  packs:
    - pack: Nuvoton::NuMicroM23_DFP
  misc:
    - for-compiler: AC6
      C: [-std=c99, -fno-rtti, -funsigned-char, -fshort-enums, -fshort-wchar, -ffunction-sections, -fdata-sections, -D__MICROLIB, -o0, -gdwarf-4]
      ASM: [-D__MICROLIB]
      Link: [--library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
    - for-compiler: GCC
      C: [-std=gnu11, --specs=nano.specs, -Wno-return-type, -Wno-unused-but-set-variable, -fdata-sections, -ffunction-sections, -fno-builtin, -fshort-enums, -funsigned-char, -mthumb, -Wno-main, -gdwarf-4]
      Link:
        - -Xlinker
        - --gc-sections
        - --specs=nano.specs
        - -Wl,-Map,"$OutDir()$/$Project$.map"
  setups:
    - output:
        type: ["elf", "bin"]
    - processor:
        endian: little
        trustzone: non-secure
    - define:
        - DEBUG_PORT: UART0_NS
  linker:
    - for-compiler: GCC
      script: Nonsecure.ld
    - for-compiler: AC6
      script: nonsecure.sct
  add-path:
    - ../../../../../Library/Device/Nuvoton/M2351/Include
    - ../../../../../Library/StdDriver/inc
    - ../../../../../Library/CMSIS/Include
    - ../../NonSecure
  groups:
    - group: CMSIS
      files:
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/ARM/startup_M2351.S
          for-compiler: AC6
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/GCC/startup_M2351.S
          for-compiler: GCC
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/system_M2351.c
    - group: User
      files:
        - file: ../main_ns.c
    - group: Library
      files:
        - file: ../../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../../Library/StdDriver/src/gpio.c
        - file: ../../Secure/lib/nsclib_Secure_vscode.o
          for-compiler: AC6
        - file: ../../Secure/lib/libnsc_vscode.a
          for-compiler: GCC
