project:
  packs:
    - pack: Nuvoton::NuMicroM23_DFP
  misc:
    - for-compiler: AC6
      C: [-std=c99, -fno-rtti, -funsigned-char, -ffunction-sections, -fdata-sections, -D__MICROLIB, -o0, -gdwarf-4]
      ASM: [-D__MICROLIB]
      Link: [--library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
    - for-compiler: GCC
      C: [-std=gnu11, --specs=nano.specs, -Wno-return-type, -Wno-unused-but-set-variable, -fdata-sections, -ffunction-sections, -fno-builtin,  -funsigned-char, -mthumb, -Wno-main, -gdwarf-4]
      Link:
        - -Xlinker
        - --gc-sections
        - --specs=nano.specs
        - -Wl,-Map,"$OutDir()$/$Project$.map"
  setups:
    - output:
        type: ["elf", "bin"]
    - processor:
        endian: little
        trustzone: non-secure
    - define:
        - DEBUG_PORT: UART0_NS
  linker:
    - for-compiler: GCC
      script: ../GCC/NonSecure.ld
    - for-compiler: AC6
      script: ../KEIL/NonSecure.sct
  add-path:
        - ../../Secure
        - ../../../../../Library/Device/Nuvoton/M2351/Include
        - ../../../../../Library/CMSIS/Include
        - ../../../../../Library/StdDriver/inc
  groups:
    - group: CMSIS
      files:
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/ARM/startup_M2351.S
          for-compiler: AC6
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/GCC/startup_M2351.S
          for-compiler: GCC
        - file: ../../../../../Library/Device/Nuvoton/M2351/Source/system_M2351.c
    - group: User
      files:
        - file: ../main_ns.c
    - group: Library
      files:
        - file: ../../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../../Library/StdDriver/src/MKROMLib_Keil.lib
        - file: ../../Secure/lib/nsclib_Secure_vscode.o
          for-compiler: AC6
        - file: ../../../../../Library/StdDriver/src/libmkrom.a
        - file: ../../../../../SampleCode/MKROM/NSCLibDemo/Secure/lib/libnsc_vscode.a
          for-compiler: GCC
