project:
  packs:
    - pack: Nuvoton::NuMicroM23_DFP
  misc:
    - for-compiler: AC6
      C: [-std=c99, -flto, -fno-rtti, -funsigned-char, -fshort-enums, -fshort-wchar, -ffunction-sections, -fdata-sections, -D__MICROLIB, -gdwarf-4]
      ASM: [-D__MICROLIB, -DStack_Size=0x1000]
      Link: [--lto, --library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
  setups:
    - output:
        type: ["elf", "bin"]
  linker:
    - for-compiler: AC6
      script: ../../../../Library/Device/Nuvoton/M2351/Source/ARM/LDROM.sct
  add-path:
        - ../../../../Library/CMSIS/Include
        - ../../../../Library/Device/Nuvoton/M2351/Include
        - ../../../../Library/StdDriver/inc
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/M2351/Source/ARM/startup_M2351.S
          for-compiler: AC6
        - file: ../../../../Library/Device/Nuvoton/M2351/Source/system_M2351.c
    - group: User
      files:
        - file: ../descriptors.c
        - file: ../main.c
        - file: ../fmc_user.c
        - file: ../usbd_user.c
        - file: ../dfu_transfer.c
